<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Kometa</title>
  </head>
  <body style="margin: 0; background-color: #000000">
    <div id="scene-container"></div>
    <!-- Loading cover: same black / thin white border / square-corner look as
         #kometa-panel and #enter-vr-button. Removed by src/core/loading-screen.ts
         once the world finishes building. Inline styles so it paints before
         the stylesheet below and the module bundle arrive. -->
    <div
      id="loading-screen"
      style="position: fixed; inset: 0; z-index: 30; background-color: #000000"
    >
      <div id="loading-box">
        <div id="loading-label">LOADING</div>
        <div id="loading-track"><div id="loading-fill"></div></div>
      </div>
    </div>
    <style>
      /* Same source font the in-world notification HUD's MSDF atlas is
         generated from (see src/vfx/fonts/font-registry.ts's "hud" ==
         Carrois Gothic SC) — used here as a real @font-face instead, since
         this button is a plain DOM overlay outside the WebXR scene, not a
         PanelUI/uikitml element. */
      @font-face {
        font-family: 'CarroisGothicSC';
        src: url('/fonts/CarroisGothicSC-Regular.ttf') format('truetype');
      }
      @font-face {
        font-family: 'ImperialScript';
        src: url('/fonts/ImperialScript-Regular.ttf') format('truetype');
        font-display: block;
      }
      #loading-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease;
      }
      #loading-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3vmin;
        padding: 4vmin 8vmin;
        background-color: #000000;
        border: 2px solid #ffffff;
        border-radius: 0;
        user-select: none;
      }
      #loading-label {
        font-family: 'CarroisGothicSC', sans-serif;
        font-weight: bold;
        font-size: clamp(14px, 2.4vmin, 32px);
        letter-spacing: 0.14em;
        color: #d4d4d8;
      }
      #loading-track {
        width: min(60vw, 420px);
        height: 10px;
        border: 2px solid #ffffff;
        border-radius: 0;
        padding: 2px;
        box-sizing: content-box;
      }
      #loading-fill {
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        transform: scaleX(0);
        transform-origin: left center;
      }
      /* Browser-window twin of the in-headset main-menu title panel (see
         ui/start-menu.uikitml's .menu-root/.title-row): black box, thin white
         border, square corners, a large script "K" + the hud-font "ometa" —
         same 2.6:1 K-to-rest size ratio (8.4 : 3.2 there). Shown/hidden with
         the Enter VR button (see src/index.ts). */
      #kometa-panel {
        position: fixed;
        left: 50%;
        bottom: 240px;
        transform: translateX(-50%);
        z-index: 10;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4vmin 8vmin 3.5vmin;
        background-color: #000000;
        border: 2px solid #ffffff;
        border-radius: 0;
        color: #ffffff;
        white-space: nowrap;
        user-select: none;
      }
      /* Corner flourishes are scaled up for the larger panel (the button's own
         are a fixed 24px). */
      #kometa-panel .corner {
        width: clamp(42px, 7.5vmin, 108px);
        height: clamp(42px, 7.5vmin, 108px);
      }
      #kometa-panel .title-row {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #kometa-panel .tagline {
        text-align: center;
        margin-top: 3vmin;
        font-family: 'CarroisGothicSC', sans-serif;
        font-size: clamp(14px, 2.4vmin, 32px);
        letter-spacing: 0.14em;
        line-height: 1.2;
        color: #d4d4d8;
      }
      /* Studio credit: a bit larger than the tagline above it, flanked by dots. */
      #kometa-panel .tagline-studio {
        font-size: 1.3em;
      }
      #kometa-panel .title-k {
        font-family: 'ImperialScript', cursive;
        font-size: calc(clamp(48px, 9vmin, 140px) * 2.625);
        line-height: 1;
      }
      #kometa-panel .title-rest {
        font-family: 'CarroisGothicSC', sans-serif;
        font-weight: bold;
        font-size: clamp(48px, 9vmin, 140px);
        line-height: 1;
      }
      /* Matches ui/notification-hud.uikitml's .hud-box/.hud-corner look —
         solid black fill, thin white border, square (unrounded) corners,
         and the same corner.png swirl flourish reused at all four corners
         via 90-degree-step rotation (see that file's own comment for why
         one image covers all four). */
      #enter-vr-button {
        position: fixed;
        left: 50%;
        bottom: 48px;
        transform: translateX(-50%);
        z-index: 10;
        padding: 30px 56px;
        font-family: 'CarroisGothicSC', sans-serif;
        font-size: 26px;
        font-weight: bold;
        color: #ffffff;
        background-color: #000000;
        border: 2px solid #ffffff;
        border-radius: 0;
        cursor: pointer;
        display: none;
      }
      /* Optional cloud-save sign-in (see src/index.ts) — a quieter,
         smaller sibling of #enter-vr-button, tucked top-right so it never
         competes with the main call to action. */
      #login-button {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 10;
        padding: 12px 22px;
        font-family: 'CarroisGothicSC', sans-serif;
        font-size: 16px;
        letter-spacing: 0.08em;
        color: #d4d4d8;
        background-color: #000000;
        border: 2px solid #ffffff;
        border-radius: 0;
        cursor: pointer;
        display: none;
      }
      [id] > .corner {
        position: absolute;
        width: 24px;
        height: 24px;
      }
      [id] > .corner-bl {
        left: 0;
        bottom: 0;
        transform: rotate(0deg);
      }
      [id] > .corner-tl {
        left: 0;
        top: 0;
        transform: rotate(90deg);
      }
      [id] > .corner-tr {
        right: 0;
        top: 0;
        transform: rotate(180deg);
      }
      [id] > .corner-br {
        right: 0;
        bottom: 0;
        transform: rotate(270deg);
      }
    </style>
    <div id="kometa-panel">
      <img class="corner corner-bl" src="/textures/corner.png" />
      <img class="corner corner-tl" src="/textures/corner.png" />
      <img class="corner corner-tr" src="/textures/corner.png" />
      <img class="corner corner-br" src="/textures/corner.png" />
      <div class="title-row">
        <span class="title-k">K</span>
        <span class="title-rest">ometa</span>
      </div>
      <div class="tagline">AN EXPERIENCE OF STARDUST AND FATE<br><span class="tagline-studio">· VIRTUALPEBBLE ·</span></div>
    </div>
    <button id="enter-vr-button">
      <img class="corner corner-bl" src="/textures/corner.png" />
      <img class="corner corner-tl" src="/textures/corner.png" />
      <img class="corner corner-tr" src="/textures/corner.png" />
      <img class="corner corner-br" src="/textures/corner.png" />
      Enter VR
    </button>
    <button id="login-button">Sign in to save progress</button>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
