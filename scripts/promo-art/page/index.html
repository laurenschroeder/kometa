<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kometa promo renderer</title>
    <style>
      body { margin: 0; background: #000; }
      canvas { display: block; }
    </style>
    <!-- Seed Math.random BEFORE any module evaluates — the game's geometry
         helpers (buildOrganicGeometry etc.) roll their shapes at import and
         call time, so a fixed seed per shot makes every render reproducible. -->
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const shot = JSON.parse(atob(params.get('shot') || 'e30='));
        window.__shot = shot;
        let a = (shot.seed ?? 1) >>> 0;
        Math.random = function () {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      })();
    </script>
  </head>
  <body>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
